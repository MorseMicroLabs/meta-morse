[pytest]
testpaths = .
python_files = test_*.py
norecursedirs = selftest dsup results .git __pycache__
addopts = -ra --strict-markers --tb=short
timeout = 900
markers =
    board: needs the board
    host: runs on this machine only. Doesn't touch the board
    halow: about the HaLow (s1g) radio and wpa_supplicant_s1g
    standard: about the standard radio and wpa_supplicant
    disruptive: reboots the board; runs only with --run-disruptive
    unit: NetworkManager's own unit tests, run on the board
    selftest: checks the test framework itself, no board needed
log_cli = false
